[project]
name = "opticol"
version = "1.0.0"
description = "Memory optimized implementations for the main Python Collection ABCs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.black]
line-length = 100
target-version = ["py312"]
preview = true

[tool.uv.sources]
guppy3 = { git = "https://github.com/zhuyifei1999/guppy3.git", rev = "da86ab98abf20c57b9ead4d653157af8baaa8efd" }

[tool.pytest]
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
python_functions = ["test_", "bench_"]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "codespell>=2.4.1",
    "guppy3",
    "mypy>=1.19.0",
    "pylint>=4.0.4",
    "pytest>=9.0.2",
    "pytest-benchmark>=5.2.3",
    "pytest-regex>=0.2.0",
]
